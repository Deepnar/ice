[project]
name = "ice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "alembic>=1.18.4",
    "beautifulsoup4>=4.15.0",
    "datasets>=4.8.5",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "huggingface-hub>=1.17.0",
    "instructor>=1.15.1",
    "matplotlib>=3.11.0",
    "mcp>=1.27",
    "ollama>=0.6.2",
    "openai>=2.40.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.5.1",
    "sglang[all]>=0.3.6.post2",
    "sqlalchemy>=2.0.50",
    "sse-starlette>=3.4.4",
    "structlog>=26.1.0",
    "textual>=8.2.7",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.48.0",
    "vllm>=0.22.0",
    "watchdog>=6.0.0",
]

[project.scripts]
# E7: the headless MCP entrypoint — `claude mcp add ice -- uv run --directory
# <repo> ice-mcp`. Needs the build-system below (uv installs no entry points
# for build-system-less "virtual" projects).
ice-mcp = "src.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src IS the top-level (namespace) package — imports are `src.api...`; the
# editable install just points at the repo root.
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff.lint.isort]
# src/ is first-party (namespace packages, no __init__.py) — keeps import
# grouping deterministic for the boy-scout cleanup rule (docs/CLEANUP.md).
known-first-party = ["src"]
